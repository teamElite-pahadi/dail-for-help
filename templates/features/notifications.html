{% extends 'base.html' %}{% block title %}Notifications{% endblock %}{% block content %}<section class="section"><div class="container"><h1>🔔 Notifications</h1>{% for n in notifications %}<div class="content-card notification"><b>{{n.title}}</b><p>{{n.message}}</p><small>{{n.created_at.strftime('%d %b %Y %I:%M %p')}}</small></div>{% else %}<div class="content-card">No notifications.</div>{% endfor %}</div></section>{% endblock %}
