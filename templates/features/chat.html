{% extends 'base.html' %}{% block title %}Chat{% endblock %}{% block content %}<section class="section"><div class="container narrow"><h1>💬 Booking Chat #{{booking.id}}</h1><div class="chat-box">{% for m in messages %}<div class="chat-msg {% if m.sender_id==current_user.id %}mine{% endif %}"><b>{{m.sender.name}}</b><p>{{m.message}}</p><small>{{m.created_at.strftime('%I:%M %p')}}</small></div>{% else %}<p>No messages yet.</p>{% endfor %}</div><form method="post" class="chat-form"><input name="message" required placeholder="Type a message..."><button class="btn btn-primary">Send</button></form></div></section>{% endblock %}
