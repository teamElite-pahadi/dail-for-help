{% extends 'base.html' %}{% block title %}Coupons | Admin{% endblock %}{% block content %}<section class="section"><div class="container"><h1>🎟️ Coupons & Offers</h1><form method="post" class="content-card feature-form"><input name="code" placeholder="WELCOME10" required><input type="number" name="discount_percent" step="1" min="1" max="100" placeholder="Discount %" required><input type="number" name="max_discount" step="1" min="0" placeholder="Max discount ₹ (0 = no cap)"><button class="btn btn-primary">Create Coupon</button></form><div class="feature-grid">{% for c in coupons %}<div class="feature-tile"><b>{{c.code}}</b><span>{{c.discount_percent}}% off{% if c.max_discount %}, max ₹{{c.max_discount}}{% endif %}</span><form method="post" action="{{url_for('admin.toggle_coupon',coupon_id=c.id)}}"><button class="btn btn-outline">{% if c.is_active %}Disable{% else %}Enable{% endif %}</button></form></div>{% endfor %}</div></div></section>{% endblock %}
